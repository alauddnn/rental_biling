<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - REXUS PLAYSTATION</title>
    <link rel="shortcut icon" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: var(--sidebar-bg);
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--grey-dark);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .login-card h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.5em;
        }
        .login-card p {
            text-align: center;
            color: var(--grey-light);
            margin-bottom: 30px;
        }
        #loginMessage {
            color: var(--red);
            text-align: center;
            margin-bottom: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body class="dark-theme"> <div class="login-card">
        <h1>REXUS PLAYSTATION</h1>
        <p>Silakan masuk untuk melanjutkan</p>
        <form id="loginForm">
            <div id="loginMessage"></div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-actions" style="margin-top: 20px;">
                <button type="submit" class="start-btn" style="width: 100%;">Login</button>
            </div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const messageElement = document.getElementById('loginMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageElement.textContent = 'Mencoba masuk...';
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // Mengirim data ke server back-end sungguhan
                const response = await fetch('http://localhost:3001/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) { // Jika server merespons dengan sukses (status 200-299)
                    messageElement.textContent = 'Login berhasil! Mengalihkan...';
                    
                    // Simpan "tiket masuk" (token) ke localStorage
                    localStorage.setItem('authToken', data.token); 
                    localStorage.setItem('username', username); // Simpan username juga
                    
                    window.location.href = 'index.html';
                } else {
                    // Jika server merespons dengan error (misal: 401)
                    messageElement.textContent = data.message;
                }

            } catch (error) {
                messageElement.textContent = 'Gagal terhubung ke server. Pastikan server sudah berjalan.';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
